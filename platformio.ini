; PlatformIO project for the ESP32 Cheap Yellow Display (ESP32-2432S028R).
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; Display pins and driver settings are passed as build flags so the stock
; TFT_eSPI library needs no edited User_Setup.h. The values match
; https://github.com/witnessmenow/ESP32-Cheap-Yellow-Display/blob/main/DisplayConfig/User_Setup.h

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Uncomment if your board shows inverted colours (white background, dark text).
    ; -D TFT_INVERSION_ON=1
